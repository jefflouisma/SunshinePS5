[package]
name = "moonlight-mcp"
version = "0.2.0"
edition = "2021"
rust-version = "1.93"
license = "Apache-2.0"
publish = false
description = "Moonlight protocol test client for SunshinePS5: pairing, streaming, input, metrics, and HDMI reference comparison"

[[bin]]
name = "moonlight-mcp"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
clap = { version = "4", features = ["derive"] }

# HTTP(S) API. TLS is configured manually so the host certificate can be pinned to the one
# obtained during pairing, as Moonlight clients do.
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls-manual-roots"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
roxmltree = "0.21"

# Pairing and stream cryptography
rcgen = "0.13"
aws-lc-rs = "1.19"
sha2 = "0.10"
aes = "0.8"
aes-gcm = "0.10"
cbc = "0.1"
x509-parser = "0.16"
pem = "3"
rand = "0.8"
hex = "0.4"
uuid = { version = "1", features = ["v4"] }
dirs = "5"

# Control stream transport (pure-Rust port of ENet 1.3)
rusty_enet = "0.4"

# Audio decoding (opusic-sys builds bundled libopus with CMake by default)
opus = "0.4"
nix = { version = "=0.31.3", default-features = false, features = ["time"] }
rustix = { version = "=1.1.3", default-features = false, features = ["std", "fs"] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }
