name: Portable core and test client

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  portable:
    name: Core, client, quality and sanitizers (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-14]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    env:
      RUSTFLAGS: -Dwarnings
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Isolated build and scratch directories
        run: |
          echo "TMPDIR=$RUNNER_TEMP" >> "$GITHUB_ENV"
          echo "CARGO_TARGET_DIR=$RUNNER_TEMP/cargo-target" >> "$GITHUB_ENV"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - name: Linux native dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes pkg-config libtinfo5 libx264-dev libx265-dev zlib1g-dev
      - name: LLVM 18 on Linux
        if: runner.os == 'Linux'
        uses: KyleMayes/install-llvm-action@a7a1a882e2d06ebe05d5bb97c3e1f8c984ae96fc # v2.0.7
        with:
          version: '18.1.8'
          directory: ${{ runner.temp }}/llvm
      - name: macOS native dependencies and LLVM 18
        if: runner.os == 'macOS'
        run: |
          brew install llvm@18 pkg-config x264 x265
          echo "LLVM_PATH=$(brew --prefix llvm@18)" >> "$GITHUB_ENV"
      - name: Locked language tooling
        run: |
          rustup toolchain install 1.93.0 --profile minimal --component rustfmt --component clippy
          cargo_path=$(rustup which --toolchain 1.93.0 cargo)
          dirname -- "$cargo_path" >> "$GITHUB_PATH"
          python -m venv .venv
          .venv/bin/python -m pip install --require-hashes -r tests/requirements.lock
          npm ci
      - name: Complete Python schema and release-evidence unit suites
        run: |
          .venv/bin/python -m pytest --collect-only -q -p no:cacheprovider tests/unit > "$TMPDIR/python-tests.txt"
          .venv/bin/python - "$TMPDIR/python-tests.txt" <<'PYTHON'
          import sys
          from pathlib import Path

          discovered = {
              line.split("::", 1)[0]
              for line in Path(sys.argv[1]).read_text().splitlines()
              if "::" in line
          }
          required = {
              path.as_posix() for path in Path("tests/unit").rglob("test_*.py")
          } | {"tests/unit/test_schemas.py", "tests/unit/test_release_evidence.py"}
          if not required <= discovered:
              raise SystemExit(f"Missing Python unit suites: {sorted(required - discovered)}")
          print(f"Discovered all {len(required)} Python unit suites")
          PYTHON
          .venv/bin/python -m pytest -q -p no:cacheprovider tests/unit
      - name: Locked maintained Opus client binding
        run: |
          cargo metadata --locked --format-version 1 \
            --manifest-path tools/moonlight-mcp/Cargo.toml > "$TMPDIR/client-dependencies.json"
          python - "$TMPDIR/client-dependencies.json" <<'PYTHON'
          import json
          import sys
          from pathlib import Path

          graph = json.loads(Path(sys.argv[1]).read_text())
          packages = graph["packages"]
          if any(package["name"] == "audiopus_sys" for package in packages):
              raise SystemExit("Unmaintained audiopus_sys remains in the client graph")
          for name, version in (("opus", "0.4.0"), ("opusic-sys", "0.7.6")):
              matches = [package for package in packages if package["name"] == name]
              if len(matches) != 1 or matches[0]["version"] != version:
                  raise SystemExit(f"Unexpected locked {name} version")
              print(f"{name} {version}")
          binding = next(package for package in packages if package["name"] == "opusic-sys")
          node = next(node for node in graph["resolve"]["nodes"] if node["id"] == binding["id"])
          if "bundled" not in node["features"]:
              raise SystemExit("Locked Opus must use its bundled native source")
          native = Path(binding["manifest_path"]).parent / "opus/package_version"
          if native.read_text().strip() != 'PACKAGE_VERSION="1.6.1"':
              raise SystemExit("Unexpected bundled Opus version")
          print("bundled libopus 1.6.1; audiopus_sys absent")
          PYTHON
      # ffmpeg.org intermittently resets connections from hosted runners. The
      # archive is cached by its pinned digest and still verified below.
      - name: Cached FFmpeg 8.0.1 source archive
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ runner.temp }}/ffmpeg-archive
          key: ffmpeg-8.0.1-05ee0b03119b45c0bdb4df654b96802e909e0a752f72e4fe3794f487229e5a41
      - name: Verified FFmpeg 8.0.1 for native SDR/HDR fixture tests
        run: |
          mkdir "$TMPDIR/ffmpeg-source"
          archive_cache="$RUNNER_TEMP/ffmpeg-archive/ffmpeg-8.0.1.tar.xz"
          if [ ! -s "$archive_cache" ]; then
            mkdir -p "$(dirname "$archive_cache")"
            curl --fail --location --proto '=https' --tlsv1.2 \
              --retry 6 --retry-delay 20 --retry-all-errors --connect-timeout 30 \
              https://ffmpeg.org/releases/ffmpeg-8.0.1.tar.xz -o "$archive_cache"
          fi
          cp "$archive_cache" "$TMPDIR/ffmpeg-source/ffmpeg-8.0.1.tar.xz"
          python - "$TMPDIR/ffmpeg-source" <<'PYTHON'
          import hashlib
          import sys
          import tarfile
          from pathlib import Path

          directory = Path(sys.argv[1])
          archive = directory / "ffmpeg-8.0.1.tar.xz"
          expected = "05ee0b03119b45c0bdb4df654b96802e909e0a752f72e4fe3794f487229e5a41"
          if hashlib.sha256(archive.read_bytes()).hexdigest() != expected:
              raise SystemExit("FFmpeg source digest mismatch")
          with tarfile.open(archive) as source:
              source.extractall(directory, filter="data")
          PYTHON
          cd "$TMPDIR/ffmpeg-source/ffmpeg-8.0.1"
          ./configure --prefix="$TMPDIR/ffmpeg" \
            --disable-everything --disable-autodetect --disable-network \
            --disable-doc --disable-debug --disable-x86asm --enable-ffmpeg --enable-ffprobe \
            --enable-protocol=file,pipe --enable-demuxer=h264,hevc,rawvideo \
            --enable-parser=h264,hevc --enable-muxer=h264,hevc,rawvideo,image2 \
            --enable-decoder=h264,hevc,rawvideo,wrapped_avframe --enable-encoder=libx264,libx265,png,rawvideo \
            --enable-filter=testsrc2,format,scale --enable-indev=lavfi \
            --enable-libx264 --enable-libx265 --enable-zlib --enable-gpl
          make -j4
          make install
          for tool in ffmpeg ffprobe; do
            "$TMPDIR/ffmpeg/bin/$tool" -version > "$TMPDIR/$tool-version.txt"
            head -n 1 "$TMPDIR/$tool-version.txt"
            head -n 1 "$TMPDIR/$tool-version.txt" | grep -Eq "^$tool version 8\.0\.1 "
          done
          echo "$TMPDIR/ffmpeg/bin" >> "$GITHUB_PATH"
      - name: Warning-free portable core
        run: |
          cmake -S . -B "$TMPDIR/core-build" -DBUILD_TESTING=ON -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_C_COMPILER="$LLVM_PATH/bin/clang"
          cmake --build "$TMPDIR/core-build" --parallel
      - name: Require real runtime and fake unit tests
        run: |
          ctest --test-dir "$TMPDIR/core-build" --show-only=json-v1 > "$TMPDIR/tests.json"
          python - "$TMPDIR/tests.json" <<'PY'
          import json
          import sys

          tests = json.load(open(sys.argv[1], encoding="utf-8"))["tests"]
          units = {
              test["name"] for test in tests
              if any(prop["name"] == "LABELS" and "unit" in prop["value"]
                     for prop in test.get("properties", []))
          }
          required = {"test_runtime", "test_fakes"}
          if not required <= units:
              raise SystemExit(f"Missing real core unit tests: {sorted(required - units)}")
          PY
          cmake --build "$TMPDIR/core-build" --target check
          ctest --test-dir "$TMPDIR/core-build" --output-on-failure --no-tests=error -LE pending-core
      - name: Locked warning-free client and complete unit/contract suites
        run: |
          rustup run 1.93.0 cargo build --manifest-path tools/moonlight-mcp/Cargo.toml --locked --all-targets --all-features
          rustup run 1.93.0 cargo test --manifest-path tools/moonlight-mcp/Cargo.toml \
            --locked --all-targets --all-features -- --list > "$TMPDIR/rust-tests.txt"
          python - "$TMPDIR/rust-tests.txt" <<'PY'
          import sys
          from pathlib import Path

          tests = [line for line in Path(sys.argv[1]).read_text().splitlines()
                   if line.endswith(": test")]
          if not tests:
              raise SystemExit("Rust unit test discovery is empty")
          required = {
              "independent_installations_have_isolated_persistent_identities",
              "unavailable_run_emits_incomplete_report_with_all_declared_criteria",
              "native_sdr_geometry_and_pixels_survive_disk_roundtrip",
              "cli_invalid_declaration_exits_64_without_report_or_identity",
              "cli_unavailable_provider_finalizes_all_criteria_and_exits_2",
              "cli_reference_lifecycle_binding_cannot_promote_an_unstarted_run",
              "cli_reference_recording_binding_cannot_promote_an_unstarted_run",
              "cli_comparison_failure_is_nonzero_and_survives_incomplete_precedence",
              "agent_run_and_compare_keep_failure_and_incomplete_typed_over_real_stdio",
              "complete_correlated_observations_require_every_check_and_retain_verified_bytes",
              "observed_failure_survives_missing_checks_and_foreign_provenance_cannot_establish_acceptance",
              "absent_invalid_or_uncorrelated_observations_cannot_pass",
              "corrupt_missing_unbound_or_duplicate_artifacts_are_rejected",
              "manifest_artifacts_and_paths_are_bounded",
              "native_populations_recompute_scores_and_require_calibration_hdr_and_difference_oracles",
              "report_matrix_requires_all_four_outcomes_and_full_equality",
              "calibrated_delay_containment_disjointness_and_overlap_have_distinct_verdicts",
              "contradictory_scores_metadata_partial_populations_and_unsafe_sources_are_rejected",
              "missing_populations_and_reports_remain_incomplete",
              "source_integrity_symlinks_capacity_and_cross_run_binding_are_rejected",
              "cli_exposes_recording_binding_for_run_and_mcp_startup",
              "runner::tests::reference_recording_verified_oracle_failure_survives_byte_and_file_quota_exhaustion",
              "http::tests::wolf_app_hdr_text_matches_official_moonlight_without_rejecting_apps",
              "http::tests::cancel_accepts_wolf_status_response_and_verifies_current_game",
              "rtsp::tests::wolf_describe_can_use_connection_close_without_content_length",
              "rtsp::tests::legacy_audio_opt_in_sets_nvflag_without_sunshine_extension",
              "runner::tests::received_frame_rate_uses_a_boot_scoped_clock_and_rate_unit",
          }
          discovered = {line.removesuffix(": test") for line in tests}
          if not required <= discovered:
              raise SystemExit(f"Missing required client contract cases: {sorted(required - discovered)}")
          print(f"Discovered {len(tests)} Rust unit and contract tests")
          PY
          rustup run 1.93.0 cargo test --manifest-path tools/moonlight-mcp/Cargo.toml \
            --locked --all-targets --all-features -- --include-ignored
      - name: Reference observer synthetic acquisition and consumer contracts
        run: |
          rustup run 1.93.0 cargo fetch --locked --manifest-path tools/reference-observer/contract-check/Cargo.toml
          .venv/bin/python -B tools/reference-observer/verify.py --evidence-dir "$RUNNER_TEMP/reference-observer-evidence"
      - name: Language formatters, linters and locked-tool checks
        run: |
          LLVM_BIN="$LLVM_PATH/bin" QUALITY_BUILD_DIR="$TMPDIR/core-build" ./scripts/check-quality.sh
      - name: ASan and UBSan core and fake tests
        env:
          ASAN_OPTIONS: halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: |
          sanitizer_cc="$LLVM_PATH/bin/clang"
          if [[ "$RUNNER_OS" == macOS ]]; then
            # Native runtime supports the runner's macOS version; LLVM 18 still gates regular builds.
            sanitizer_cc=/usr/bin/clang
          fi
          cmake -S . -B "$TMPDIR/sanitizer-build" -DBUILD_TESTING=ON -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_C_COMPILER="$sanitizer_cc" \
            '-DCMAKE_C_FLAGS=-fsanitize=address,undefined -fno-omit-frame-pointer' \
            '-DCMAKE_EXE_LINKER_FLAGS=-fsanitize=address,undefined'
          cmake --build "$TMPDIR/sanitizer-build" --parallel
          cmake --build "$TMPDIR/sanitizer-build" --target check
          ctest --test-dir "$TMPDIR/sanitizer-build" --output-on-failure --no-tests=error -LE pending-core
